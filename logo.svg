<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2638" />
      <stop offset="100%" stop-color="#111622" />
    </linearGradient>

    <!-- Document Glow Filter -->
    <filter id="doc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Spark Glow Filter -->
    <filter id="spark-glow">
      <feGaussianBlur stdDeviation="3" />
      <feComposite in="SourceGraphic" operator="over" />
    </filter>
  </defs>

  <!-- iOS Square Single Background Layer (Squircle) -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bg-grad)" stroke="#2e384e" stroke-width="4" />

  <!-- 8-Bit Pixel Grid Graphic -->
  <g transform="translate(0, 0)">
    
    <!-- Anvil Shadow -->
    <path d="M 120 400 L 392 400 L 376 412 L 136 412 Z" fill="#0b0e14" opacity="0.6" />

    <!-- 8-bit Pixel Anvil -->
    <!-- Base -->
    <rect x="176" y="360" width="160" height="24" fill="#2c3545" />
    <rect x="192" y="384" width="128" height="16" fill="#1e2532" />
    
    <!-- Stem -->
    <rect x="216" y="304" width="80" height="56" fill="#3b465a" />
    <rect x="224" y="304" width="32" height="56" fill="#4a576e" />
    
    <!-- Horn & Body -->
    <path d="M 104 264 L 160 264 L 160 304 L 136 304 Z" fill="#4a576e" />
    <path d="M 104 264 L 160 264 L 160 280 L 120 280 Z" fill="#606f8a" />
    
    <rect x="160" y="264" width="232" height="40" fill="#3b465a" />
    <rect x="160" y="264" width="232" height="12" fill="#606f8a" />
    <rect x="160" y="264" width="120" height="12" fill="#7a8ba8" />
    
    <rect x="376" y="272" width="32" height="32" fill="#2c3545" />

    <!-- 8-bit Pixel Glowing Document -->
    <!-- Glow Backing -->
    <rect x="216" y="128" width="112" height="136" rx="4" fill="#ffaa00" opacity="0.3" filter="url(#doc-glow)" />
    
    <!-- Document Body -->
    <rect x="224" y="136" width="96" height="120" fill="#ffcc00" />
    <rect x="232" y="144" width="80" height="104" fill="#fff5cc" />
    
    <!-- Folded Corner -->
    <path d="M 304 136 L 320 152 L 304 152 Z" fill="#dba000" />
    
    <!-- Pixel Text Lines on Document -->
    <rect x="244" y="160" width="56" height="8" fill="#e69d00" />
    <rect x="244" y="176" width="40" height="8" fill="#e69d00" />
    <rect x="244" y="192" width="48" height="8" fill="#e69d00" />
    <rect x="244" y="208" width="32" height="8" fill="#e69d00" />
    <rect x="244" y="224" width="52" height="8" fill="#e69d00" />

    <!-- 8-Bit Pixel Hammer -->
    <g transform="translate(40, -10) rotate(15, 340, 160)">
      <!-- Handle -->
      <rect x="350" y="140" width="16" height="96" rx="2" fill="#8b5a2b" transform="rotate(-35, 350, 140)" />
      <rect x="354" y="140" width="6" height="96" fill="#a66c35" transform="rotate(-35, 350, 140)" />
      
      <!-- Head -->
      <rect x="290" y="100" width="56" height="36" fill="#525e75" rx="2" transform="rotate(-35, 290, 100)" />
      <rect x="290" y="100" width="56" height="12" fill="#7887a4" transform="rotate(-35, 290, 100)" />
    </g>

    <!-- Pixel Sparks / Forge Energy -->
    <rect x="200" y="160" width="8" height="8" fill="#ffcc00" />
    <rect x="184" y="192" width="6" height="6" fill="#ff9900" />
    <rect x="210" y="230" width="8" height="8" fill="#ffaa00" />
    <rect x="336" y="180" width="8" height="8" fill="#ffdd55" />
    <rect x="352" y="210" width="6" height="6" fill="#ffaa00" />
    <rect x="330" y="140" width="8" height="8" fill="#ff8800" />

  </g>
</svg>
